plugins {
	id 'java-library'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.140'
	id "dev.ftb.plugins.ashwing" version "0.2.2"
}

tasks.named('wrapper', Wrapper).configure {
	distributionType = Wrapper.DistributionType.BIN
}

version = ashwing.utils().createNeoLikeVersion(project.minecraft_version, project.mod_version)
group = project.maven_group

ashwing {
	modName = project.mod_name
	modId = project.mod_id

	publishing {
		curseForgeToken = providers.environmentVariable("CURSEFORGE_KEY").getOrNull()

		forClientAndServer()
		releaseFromString(providers.environmentVariable("TAG").getOrElse(""))
		minecraftVersion(project.minecraft_version)

		withMaven()

		modProject {
			fileFromTask(project, "jar")

			modLoader = "neoforge"
			curseForgeId = 1611134
		}
	}
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
	version = ashwing.utils().createNeoForgeVersion(project.minecraft_version, project.neo_version)

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version.replace("\${mc_version}", minecraft_version)
	}

	runs {
		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'
			logLevel = org.slf4j.event.Level.DEBUG
		}

		client {
			client()

			// Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
	runtimeClasspath.extendsFrom localRuntime
}

repositories {
	def repos = ashwing.repos(project)

	repos.neoforge()
	repos.ftb()
	repos.ftbSnapshots()
	repos.curseMaven()
	repos.modrinth()
	repos.architectury()
	repos.tterrag()
	repos.modmaven {
		it.includeGroup("mezz.jei")
		it.includeGroup("mekanism")
	}
	repos.jitpack {
		it.includeGroup("com.github.cech12.BucketLib")
	}

	maven {
		url = "https://maven.createmod.net"
	}

	maven {
		url = "https://maven.ryanhcode.dev/releases"
		content { includeGroup "dev.ryanhcode.sable-companion" }
	}

	maven {
		url = "https://maven.idiotss.com/releases"
		content {
			includeGroup "org.antarcticgardens.cna"
			includeGroup "org.antarcticgardens.esl"
		}
	}
}

dependencies {
	implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"

	compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
	compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
	localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

	compileOnly "dev.ftb.mods:ftb-essentials-neoforge:${ftb_essentials_version}"
	compileOnly "curse.maven:oritech-1030830:8211754"
	compileOnly "curse.maven:ars-nouveau-401955:8262663"
	compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
	compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
	compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"
	compileOnly "curse.maven:sable-1312371:8242682"
	compileOnly "curse.maven:create-sifting-661938:7329807"
	compileOnly "curse.maven:jade-324717:7545219"
	compileOnly "curse.maven:fishing-overhaul-491332:6297564"

	compileOnly "mekanism:Mekanism:${mekanism_version}"
	compileOnly "maven.modrinth:modern-industrialization:${modern_industrialization_version}"
	compileOnly "com.github.cech12.BucketLib:neoforge:${bucketlib_version}"
	compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

	compileOnly("org.antarcticgardens.cna:create-new-age-neoforge-${minecraft_version}:${create_new_age_version}") { transitive = false }
	compileOnly("org.antarcticgardens.esl:esl-neoforge-${minecraft_version}:${esl_version}") { transitive = false }

	compileOnly "curse.maven:cyclops-core-232758:8006281"
	compileOnly "curse.maven:integrated-dynamics-236307:8039124"
	compileOnly "curse.maven:sky-archipelago-1528077:8383558"
	compileOnly "curse.maven:productivebees-377897:8022994"
	compileOnly "maven.modrinth:enderio:v8.2.10-beta"
}

tasks.register("sourcesJar", Jar) {
	archiveClassifier.set("sources")
	from sourceSets.main.allJava
}


tasks.named("jar") {
	dependsOn("sourcesJar")
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		version: version,
		mod_id: mod_id,
		mod_name: mod_name,
		pack_format: pack_format,
		loader_version_range: loader_version_range,
		mod_loader_range: mod_loader_range,
		mod_url: mod_url,
		mod_description: mod_description
	]

	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
		expand replaceProperties
	}

	// Copy in the repos license file
	from(project.rootDir) {
		include 'LICENSE.md'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
